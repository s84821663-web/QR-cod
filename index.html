```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    #login-screen {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 35px 25px;
      border-radius: 20px;
      background: white;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .login-card h1 {
      margin: 0 0 12px;
      color: #2563eb;
      font-size: 30px;
    }

    .login-card p {
      margin-bottom: 25px;
      color: #64748b;
      line-height: 1.8;
    }

    #password {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    #password:focus {
      border-color: #2563eb;
    }

    #login-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #login-button:hover {
      background: #1d4ed8;
    }

    #error-message {
      min-height: 24px;
      margin-top: 12px;
      color: #dc2626;
      font-size: 14px;
    }

    #main-content {
      display: none;
      max-width: 1000px;
      margin: 40px auto;
      padding: 25px;
    }

    .site-card {
      padding: 30px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- صفحه ورود -->
  <div id="login-screen">
    <div class="login-card">
      <h1>QR Studio</h1>
      <p>برای ورود به سایت، رمز عبور را وارد کنید.</p>

      <form id="login-form">
        <input
          id="password"
          type="password"
          placeholder="رمز عبور"
          autocomplete="current-password"
          required
        >

        <button id="login-button" type="submit">
          ورود به سایت
        </button>

        <div id="error-message" role="alert"></div>
      </form>
    </div>
  </div>

  <!-- محتوای اصلی سایت -->
  <main id="main-content">
    <div class="site-card">
      <h1>به QR Studio خوش آمدید</h1>
      <p>ورود شما با موفقیت انجام شد.</p>

      <!-- کد اصلی ابزار تولید QR خود را اینجا قرار دهید -->
    </div>
  </main>

  <script>
    (function () {
      const SITE_PASSWORD = "srqu12";
      const AUTH_KEY = "qrStudioAuthenticated";

      const loginScreen = document.getElementById("login-screen");
      const mainContent = document.getElementById("main-content");
      const loginForm = document.getElementById("login-form");
      const passwordInput = document.getElementById("password");
      const errorMessage = document.getElementById("error-message");

      function showSite() {
        loginScreen.style.display = "none";
        mainContent.style.display = "block";
      }

      try {
        if (localStorage.getItem(AUTH_KEY) === "true") {
          showSite();
        }
      } catch (error) {
        // در صورت غیرفعال بودن localStorage، ورود در همین صفحه ممکن است.
      }

      loginForm.addEventListener("submit", function (event) {
        event.preventDefault();

        if (passwordInput.value === SITE_PASSWORD) {
          try {
            localStorage.setItem(AUTH_KEY, "true");
          } catch (error) {
            // اگر ذخیره‌سازی در دسترس نباشد، ورود همچنان انجام می‌شود.
          }

          errorMessage.textContent = "";
          showSite();
        } else {
          errorMessage.textContent = "رمز عبور اشتباه است!";
          passwordInput.value = "";
          passwordInput.focus();
        }
      });
    })();
  </script>

</body>
</html>
